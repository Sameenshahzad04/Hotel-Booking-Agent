<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Pearl Continental Hotel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-[#0b0f17] text-[#f3f4f6] font-sans flex items-center justify-center min-h-screen">
  <div class="max-w-md w-full bg-[#131b2c] p-8 border border-white/10 shadow-2xl">
    <div class="text-center mb-8">
      <a href="home.html" class="font-serif text-2xl tracking-widest text-[#d4af37] font-bold">PEARL CONTINENTAL</a>
      <p class="text-xs uppercase tracking-widest text-gray-400 mt-2">Welcome Back, Esteemed Guest</p>
    </div>
    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
      <div>
        <label class="block text-xs uppercase tracking-widest text-gray-400 mb-1">Email Address</label>
        <input type="email" id="loginEmail" required
          class="w-full bg-[#0b0f17] border border-white/10 px-4 py-3 text-sm text-white outline-none focus:border-[#d4af37]"
          placeholder="sameenshahzad04@gmail.com">
      </div>
      <div>
        <label class="block text-xs uppercase tracking-widest text-gray-400 mb-1">Password</label>
        <input type="password" id="loginPassword" required
          class="w-full bg-[#0b0f17] border border-white/10 px-4 py-3 text-sm text-white outline-none focus:border-[#d4af37]"
          placeholder="••••••••">
      </div>
      <button type="submit"
        class="w-full py-4 bg-[#d4af37] text-black font-bold text-xs uppercase tracking-widest hover:bg-[#c5a028] transition-all">Sign
        In</button>
    </form>
    <p class="text-center text-xs text-gray-400 mt-6">Don't have an account? <a href="register.html"
        class="text-[#d4af37] hover:underline">Register here</a></p>
  </div>
  <script src="assets/js/app.js"></script>
</body>

</html>
