<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings | Pearl Continental Hotel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-[#0b0f17] text-[#f3f4f6] font-sans">

  <header class="fixed top-0 left-0 right-0 z-50 bg-[#0b0f17]/90 backdrop-blur-md border-b border-white/10">
    <div class="max-w-7xl mx-auto px-6 h-24 flex items-center justify-between">
      <a href="home.html" class="font-serif text-2xl tracking-widest text-[#d4af37] font-bold">PEARL CONTINENTAL</a>
      <nav class="hidden md:flex items-center gap-8 text-sm font-medium tracking-wider">
        <a href="home.html" class="hover:text-[#d4af37]">HOME</a>
        <a href="bookastay.html" class="hover:text-[#d4af37]">ACCOMMODATIONS</a>
        <a href="bookings.html" class="text-[#d4af37]">MY BOOKINGS</a>
      </nav>
      <button onclick="logout()"
        class="text-xs tracking-widest text-red-400 uppercase border border-red-500/30 px-4 py-2 hover:bg-red-500/10 transition-all">Sign
        Out</button>
    </div>
  </header>

  <main class="pt-32 pb-20 max-w-7xl mx-auto px-6">
    <div class="mb-10 flex justify-between items-end">
      <div>
        <span class="text-[#d4af37] uppercase tracking-[0.2em] text-xs font-semibold">Guest Dashboard</span>
        <h1 class="font-serif text-4xl font-bold mt-2">Your Reservations</h1>
      </div>
      <a href="bookastay.html"
        class="px-6 py-3 bg-[#d4af37] text-black font-semibold text-xs tracking-widest uppercase hover:bg-[#c5a028] transition-all">New
        Reservation</a>
    </div>

    <div id="userBookingsList" class="space-y-6">
      <!-- Dynamically populated via JS -->
    </div>
  </main>

  <script src="assets/js/app.js"></script>
</body>

</html>
