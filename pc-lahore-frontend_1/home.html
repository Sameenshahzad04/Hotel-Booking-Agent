<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pearl Continental Hotel | Luxury Redefined</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-[#0b0f17] text-[#f3f4f6] font-sans antialiased selection:bg-[#d4af37] selection:text-black">

  <!-- Navigation Bar -->
  <header
    class="fixed top-0 left-0 right-0 z-50 bg-[#0b0f17]/90 backdrop-blur-md border-b border-white/10 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-6 h-24 flex items-center justify-between">
      <a href="home.html" class="flex items-center gap-3">
        <span class="font-serif text-2xl tracking-widest text-[#d4af37] font-bold">PEARL CONTINENTAL</span>
      </a>
      <nav class="hidden md:flex items-center gap-8 text-sm font-medium tracking-wider">
        <a href="home.html" class="text-[#d4af37] transition-colors">HOME</a>
        <a href="bookastay.html" class="hover:text-[#d4af37] transition-colors">ACCOMMODATIONS</a>
        <a href="bookings.html" class="hover:text-[#d4af37] transition-colors">MY BOOKINGS</a>
      </nav>
      <div class="flex items-center gap-4">
        <div id="authNavSection">
          <a href="login.html"
            class="px-5 py-2.5 text-xs font-semibold tracking-widest uppercase border border-[#d4af37] text-[#d4af37] hover:bg-[#d4af37] hover:text-black transition-all rounded-sm">Sign
            In</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="relative h-screen flex items-center justify-center overflow-hidden">
    <div class="absolute inset-0 z-0">
      <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=2000&q=80"
        alt="Luxury Hotel" class="w-full h-full object-cover scale-105 animate-pulse duration-[10000ms] opacity-40">
      <div class="absolute inset-0 bg-gradient-to-t from-[#0b0f17] via-transparent to-[#0b0f17]/60"></div>
    </div>
    <div class="relative z-10 max-w-4xl mx-auto text-center px-6 mt-16">
      <span class="text-[#d4af37] uppercase tracking-[0.3em] text-xs font-semibold mb-4 block">Five-Star Hospitality
        Experience</span>
      <h1 class="font-serif text-5xl md:text-7xl font-bold tracking-tight mb-6 leading-tight">Where Timeless Elegance
        Meets Modern Luxury</h1>
      <p class="text-gray-400 text-lg md:text-xl font-light max-w-2xl mx-auto mb-10">Immerse yourself in world-class
        comfort, exquisite dining, and legendary service at Pearl Continental.</p>
      <div class="flex flex-col sm:flex-row justify-center gap-4">
        <a href="bookastay.html"
          class="px-8 py-4 bg-[#d4af37] text-black font-semibold text-xs tracking-[0.2em] uppercase hover:bg-[#c5a028] transition-all shadow-lg">Reserve
          Your Stay</a>
        <a href="#amenities"
          class="px-8 py-4 border border-white/20 text-white font-semibold text-xs tracking-[0.2em] uppercase hover:bg-white/10 transition-all">Explore
          Amenities</a>
      </div>
    </div>
  </section>

  <!-- Quick Booking Bar Widget -->
  <section class="relative z-20 max-w-6xl mx-auto px-6 -mt-20">
    <div
      class="bg-[#131b2c] border border-[#d4af37]/30 p-8 shadow-2xl grid grid-cols-1 md:grid-cols-4 gap-6 items-center">
      <div>
        <label class="block text-xs uppercase tracking-widest text-[#d4af37] mb-2 font-semibold">Check-in Date</label>
        <input type="date" id="quickCheckIn"
          class="w-full bg-[#0b0f17] border border-white/10 px-4 py-3 text-sm text-white focus:border-[#d4af37] outline-none">
      </div>
      <div>
        <label class="block text-xs uppercase tracking-widest text-[#d4af37] mb-2 font-semibold">Check-out Date</label>
        <input type="date" id="quickCheckOut"
          class="w-full bg-[#0b0f17] border border-white/10 px-4 py-3 text-sm text-white focus:border-[#d4af37] outline-none">
      </div>
      <div>
        <label class="block text-xs uppercase tracking-widest text-[#d4af37] mb-2 font-semibold">Guests & Rooms</label>
        <select id="quickGuests"
          class="w-full bg-[#0b0f17] border border-white/10 px-4 py-3 text-sm text-white focus:border-[#d4af37] outline-none">
          <option>1 Adult, 1 Room</option>
          <option>2 Adults, 1 Room</option>
          <option>Family Suite (3+ Guests)</option>
        </select>
      </div>
      <div class="flex items-end h-full pt-6 md:pt-0">
        <button onclick="proceedToBooking()"
          class="w-full py-3.5 bg-[#d4af37] text-black font-bold text-xs uppercase tracking-widest hover:bg-[#c5a028] transition-all">Check
          Availability</button>
      </div>
    </div>
  </section>

  <script src="assets/js/app.js"></script>
</body>

</html>
