    <script>
        let rooms = [];
        document.addEventListener("DOMContentLoaded", () => {
            renderHeader("book");

            const q = new URLSearchParams(location.search);
            const today = localISO(new Date());

            // Read using shared prefs or URL/LocalStorage fallbacks
            const selectedCi = q.get("check_in") || localStorage.getItem("pc_check_in") || today;
            const selectedCo = q.get("check_out") || localStorage.getItem("pc_check_out") || addDays(selectedCi, 1);

            let adults = Number(q.get("guests") || localStorage.getItem("pc_guests") || 2);
            let children = Number(q.get("children") || localStorage.getItem("pc_children") || 0);
            let childAges = localStorage.getItem("pc_child_ages") ? JSON.parse(localStorage.getItem("pc_child_ages")) : [];

            // Save globally on load
            saveStayPrefs(selectedCi, selectedCo, adults, children);

            const ciInput = $("check-in");
            const coInput = $("check-out");

            ciInput.min = today;
            ciInput.value = selectedCi;
            coInput.min = addDays(selectedCi, 1);
            coInput.value = selectedCo;

            // --- LIVE SYNC ON DATE CHANGE ---
            ciInput.onchange = e => {
                const selectedCheckIn = e.target.value;
                const nextDay = addDays(selectedCheckIn, 1);
                coInput.min = nextDay;
                if (coInput.value <= selectedCheckIn) {
                    coInput.value = nextDay;
                }
                saveStayPrefs(ciInput.value, coInput.value, adults, children);
            };

            coInput.onchange = () => {
                saveStayPrefs(ciInput.value, coInput.value, adults, children);
            };

            // Drawer UI & Controller Elements
            const toggleBtn = $("guest-dropdown-toggle");
            const drawer = $("guest-popup-drawer");
            const summaryText = $("guest-summary-text");
            const adultCountEl = $("adult-count");
            const childCountEl = $("child-count");

            function updateSummary() {
                if (summaryText) {
                    summaryText.textContent = `${adults} Adult${adults === 1 ? '' : 's'}, ${children} Child${children === 1 ? '' : 'ren'}`;
                }
                // Instantly sync globally so checkout.html and home.html catch changes live
                saveStayPrefs(ciInput.value, coInput.value, adults, children);
            }

            function renderDrawerAges() {
                const wrapper = $("child-ages-wrapper");
                const container = $("drawer-ages-container");
                if (!wrapper || !container) return;

                if (children > 0) {
                    wrapper.style.display = "block";
                    container.innerHTML = Array.from({ length: children }, (_, i) => {
                        const age = childAges[i] !== undefined && childAges[i].age !== undefined ? childAges[i].age : 5;
                        return `
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <label style="color:#cbd5e1; font-size:0.8rem;">Child ${i + 1} Age</label>
                                <select class="drawer-age-select" data-index="${i}" style="padding:.3rem; border-radius:4px; background:#0f172a; color:#fff; border:1px solid #334155;">
                                    ${Array.from({ length: 12 }, (_, a) => `<option value="${a}" ${age === a ? 'selected' : ''}>${a} year${a === 1 ? '' : 's'}</option>`).join('')}
                                </select>
                            </div>
                        `;
                    }).join('');

                    container.querySelectorAll(".drawer-age-select").forEach(sel => {
                        sel.onchange = e => {
                            const idx = Number(e.target.getAttribute("data-index"));
                            if (!childAges[idx]) childAges[idx] = {};
                            childAges[idx].age = Number(e.target.value);
                            localStorage.setItem("pc_child_ages", JSON.stringify(childAges));
                        };
                    });
                } else {
                    wrapper.style.display = "none";
                    container.innerHTML = "";
                    localStorage.removeItem("pc_child_ages");
                }
            }

            if (toggleBtn && drawer) {
                toggleBtn.onclick = e => {
                    e.stopPropagation();
                    drawer.style.display = drawer.style.display === "block" ? "none" : "block";
                };
                document.addEventListener("click", e => {
                    if (!drawer.contains(e.target) && !toggleBtn.contains(e.target)) {
                        drawer.style.display = "none";
                    }
                });
            }

            if ($("adult-minus")) $("adult-minus").onclick = () => { if (adults > 1) { adults--; adultCountEl.textContent = adults; updateSummary(); } };
            if ($("adult-plus")) $("adult-plus").onclick = () => { if (adults < 10) { adults++; adultCountEl.textContent = adults; updateSummary(); } };

            if ($("child-minus")) $("child-minus").onclick = () => {
                if (children > 0) {
                    children--;
                    childCountEl.textContent = children;
                    childAges.pop();
                    localStorage.setItem("pc_child_ages", JSON.stringify(childAges));
                    updateSummary();
                    renderDrawerAges();
                }
            };
            if ($("child-plus")) $("child-plus").onclick = () => {
                if (children < 6) {
                    children++;
                    childCountEl.textContent = children;
                    childAges.push({ age: 5 });
                    localStorage.setItem("pc_child_ages", JSON.stringify(childAges));
                    updateSummary();
                    renderDrawerAges();
                }
            };

            if (adultCountEl) adultCountEl.textContent = adults;
            if (childCountEl) childCountEl.textContent = children;
            updateSummary();
            renderDrawerAges();

            $("filter-form").onsubmit = e => {
                e.preventDefault();
                const newCi = ciInput.value;
                const newCo = coInput.value;

                saveStayPrefs(newCi, newCo, adults, children);
                localStorage.setItem("pc_child_ages", JSON.stringify(childAges));

                const newUrl = `book.html?check_in=${newCi}&check_out=${newCo}&guests=${adults}&children=${children}`;
                history.replaceState(null, "", newUrl);

                loadRooms();

                window.addEventListener("pc-chatbot-action", () => {
                    loadRooms();
                });

                // 2. Re-fetch availability if user returns via browser Back button or switches back to tab
                window.addEventListener("pageshow", () => {
                    loadRooms();
                });
                document.addEventListener("visibilitychange", () => {
                    if (document.visibilityState === "visible") loadRooms();
                });

            };
            loadRooms();

            // --- EVENT DELEGATION FOR ROOM SELECTION ---
            const roomsContainer = $("rooms");
            if (roomsContainer) {
                roomsContainer.onclick = e => {
                    const selectBtn = e.target.closest(".btn-select-room");
                    if (!selectBtn) return;


                    e.preventDefault();

                    const roomId = selectBtn.getAttribute("data-room-id");

                    // Grab the absolute latest values from the live input fields right now
                    const liveCi = ciInput ? ciInput.value : localStorage.getItem("pc_check_in");
                    const liveCo = coInput ? coInput.value : localStorage.getItem("pc_check_out");
                    const liveGuests = localStorage.getItem("pc_guests") || "2";
                    const liveChildren = localStorage.getItem("pc_children") || "0";

                    // Save globally
                    saveStayPrefs(liveCi, liveCo, liveGuests, liveChildren);

                    // Redirect dynamically with live values
                    location.href = `checkout.html?room=${encodeURIComponent(roomId)}&check_in=${liveCi}&check_out=${liveCo}&guests=${liveGuests}&children=${liveChildren}`;
                };
            }
        });

        async function loadRooms() {
            const a = $("alert");
            a.classList.remove("show");

            const ci = $("check-in").value;
            const co = $("check-out").value;
            const g = Number(localStorage.getItem("pc_guests") || 2);

            if (!ci || !co || co <= ci) {
                a.textContent = "Check-out must be strictly after check-in.";
                a.classList.add("show");
                return;
            }

            $("rooms").innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
            try {
                const r = await apiFetch(`/rooms/availability?check_in=${encodeURIComponent(ci)}&check_out=${encodeURIComponent(co)}&guests=${g}`);
                const d = await json(r);
                if (!r.ok) throw new Error(errText(d));
                rooms = Array.isArray(d.availability) ? d.availability : (d.rooms || d.items || []);
                $("rooms").innerHTML = rooms.length ? rooms.map(roomCard).join("") : '<div class="card" style="grid-column:1/-1"><h2>No rooms available</h2><p>Try different dates or reduce guests.</p></div>';
            } catch (err) {
                $("rooms").innerHTML = `<div class="alert show" style="grid-column:1/-1">${esc(err.message)}</div>`;
            }
        }

        function roomCard(r) {
            const id = r.id || r.room_type_id || r.room_id || "";
            const ci = $("check-in") ? $("check-in").value : localStorage.getItem("pc_check_in");
            const co = $("check-out") ? $("check-out").value : localStorage.getItem("pc_check_out");
            const g = localStorage.getItem("pc_guests") || "2";
            const childrenCount = localStorage.getItem("pc_children") || "0";

            // Save active state to localStorage / URL right before generating links
            saveStayPrefs(ci, co, g, childrenCount);

            const name = r.name || r.room_type || "Luxury Room";
            const desc = r.description || "Elegant accommodation with modern comforts.";
            const price = r.price || r.base_price || 0;
            const img = r.image_url || r.image || "https://images.unsplash.com/photo-1590490360182-c33d57733427?auto=format&fit=crop&w=800&q=70";
            const amenities = Array.isArray(r.amenities) ? r.amenities : ["King Bed", "Wi-Fi", "Air Conditioning"];
            const availCount = r.available_rooms ?? 1;

            const detailUrl = `room-detail.html?room=${encodeURIComponent(id)}&check_in=${ci}&check_out=${co}&guests=${g}&children=${childrenCount}`;
            const checkoutUrl = `checkout.html?room=${encodeURIComponent(id)}`;

            return `
            <article class="card room">
                <img src="${esc(img)}" alt="${esc(name)}">
                <div class="body">
                    <div class="row between">
                        <h3>${esc(name)}</h3>
                        <span class="badge b-ok">${availCount} available</span>
                    </div>
                    <p>${esc(desc)}</p>
                    <div class="chips">${amenities.slice(0, 3).map(a => `<span class="chip">${esc(a)}</span>`).join("")}</div>
                    <div class="row between" style="margin-top:auto; align-items:center;">
                        <span class="price">${fmtPKR(price)}<small> / night</small></span>
                        <div class="row" style="gap:.5rem;">
                            <a class="btn sm" href="${detailUrl}">View details</a>
                            <a class="btn sm primary btn-select-room" data-room-id="${esc(id)}" href="${checkoutUrl}">Select room →</a>
                        </div>
                    </div>
                </div>
            </article>`;
        }
    </script>
