<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create account — Pearl Continental</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Outfit:wght@400;500;600&display=swap"
    rel="stylesheet">
</head>

<body>
  <main id="main" class="section"
    style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 136px);">
    <div class="wrap" style="max-width:480px;width:100%;">
      <div class="card">
        <h1>Create your account</h1>
        <p class="muted">Book faster and keep all reservations in one place.</p>
        <div class="alert" id="alert" role="alert"></div>
        <form id="register-form" novalidate>
          <div class="field">
            <label for="full_name">Full name</label>
            <input id="full_name" autocomplete="name" required>
            <p class="err" id="name-err"></p>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="email" required>
            <p class="err" id="email-err"></p>
          </div>
          <div class="field">
            <label for="phone">Phone (11 digits)</label>
            <input id="phone" type="tel" autocomplete="tel" placeholder="03001234567" required>
            <p class="err" id="phone-err"></p>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="pw">
              <input id="password" type="password" autocomplete="new-password" required minlength="8">
              <button type="button" id="toggle-pw">Show</button>
            </div>
            <p class="muted" style="font-size:0.8rem; margin-top:.25rem;">Use at least 8 characters.</p>
            <p class="err" id="password-err"></p>
          </div>
          <div class="field">
            <label for="confirm-password">Confirm password</label>
            <div class="pw">
              <input id="confirm-password" type="password" autocomplete="new-password" required minlength="8">
              <button type="button" id="toggle-confirm-pw" aria-label="Show confirm password">Show</button>
            </div>
            <p class="err" id="confirm-password-err"></p>
          </div>
          <button class="btn primary lg block" type="submit" style="margin-top:1rem">Create account →</button>
        </form>
        <p class="muted" style="margin-top:1rem;text-align:center">Already registered? <a href="login.html">Log in</a>
        </p>
      </div>
    </div>
  </main>
  <script src="common.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderHeader("register");
      const f = $("register-form"), a = $("alert");

      // Toggle Primary Password visibility
      $("toggle-pw").onclick = () => {
        const p = $("password"), s = p.type === "password";
        p.type = s ? "text" : "password";
        $("toggle-pw").textContent = s ? "Hide" : "Show";
      };

      // Toggle Confirm Password visibility
      $("toggle-confirm-pw").onclick = () => {
        const p = $("confirm-password"), s = p.type === "password";
        p.type = s ? "text" : "password";
        $("toggle-confirm-pw").textContent = s ? "Hide" : "Show";
      };

      f.onsubmit = async e => {
        e.preventDefault();
        a.classList.remove("show");
        $$(".err").forEach(x => x.textContent = "");

        const name = $("full_name").value.trim();
        const email = $("email").value.trim();
        const phone = $("phone").value.trim();
        const p = $("password").value;
        const c = $("confirm-password").value;

        let ok = true;
        if (name.length < 2) { $("name-err").textContent = "Enter your full name."; ok = false; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { $("email-err").textContent = "Enter a valid email address."; ok = false; }
        if (phone.replace(/\D/g, "").length !== 11) { $("phone-err").textContent = "Please enter a valid 11-digit phone number (e.g., 03001234567)."; ok = false; }
        if (p.length < 8) { $("password-err").textContent = "Password must be at least 8 characters."; ok = false; }
        if (p !== c) { $("confirm-password-err").textContent = "Passwords do not match."; ok = false; }
        if (!ok) return;

        const b = f.querySelector("button[type=submit]");
        b.disabled = true;
        b.textContent = "Creating account…";

        try {
          const r = await apiFetch("/auth/register", { method: "POST", body: JSON.stringify({ full_name: name, email, phone, password: p }) });
          const d = await json(r);
          if (!r.ok) throw new Error(errText(d, "Registration failed."));

          // Auto-login after successful registration
          const loginRes = await apiFetch("/auth/login", { method: "POST", body: JSON.stringify({ email, password: p }) });
          const loginData = await json(loginRes);
          if (loginRes.ok) {
            setSession(loginData.session_token || loginData.access_token, loginData.user || { full_name: name, email });
          }

          toast("Account created. Welcome to Pearl Continental!", "success");
          location.href = safeNext(new URLSearchParams(location.search).get("next"));
        } catch (err) {
          a.textContent = err.message;
          a.classList.add("show");
        } finally {
          b.disabled = false;
          b.textContent = "Create account →";
        }
      };
    });
  </script>
</body>

</html>
