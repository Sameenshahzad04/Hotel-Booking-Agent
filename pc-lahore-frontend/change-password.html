<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Change Password — Pearl Continental</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Outfit:wght@400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <main id="main" class="section">
        <div class="wrap" style="max-width:480px">
            <p><a href="home.html">← Back to home</a></p>
            <h1 style="margin-top:1rem;">Change Password</h1>
            <p class="muted" style="margin-bottom:1.5rem">Ensure your account is secure by using a strong password.</p>

            <div class="alert" id="alert" role="alert"></div>

            <div class="card">
                <form id="password-form" novalidate>
                    <div class="field">
                        <label for="old_password">Current Password</label>
                        <input id="old_password" type="password" required minlength="8">
                    </div>
                    <div class="field">
                        <label for="new_password">New Password</label>
                        <input id="new_password" type="password" required minlength="8"
                            placeholder="At least 8 characters">
                    </div>
                    <div class="row between" style="margin-top:1.5rem;">
                        <a class="btn" href="home.html">Cancel</a>
                        <button class="btn primary" type="submit">Update Password</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="common.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderHeader("");
            if (!getToken()) { goLogin(); return; }

            const alertBox = $("alert");

            $("password-form").onsubmit = async e => {
                e.preventDefault();
                alertBox.classList.remove("show");

                const old_password = $("old_password").value;
                const new_password = $("new_password").value;

                if (new_password.length < 8) {
                    alertBox.textContent = "New password must be at least 8 characters long.";
                    alertBox.classList.add("show");
                    return;
                }

                try {
                    const res = await apiFetch("/auth/change-password", {
                        method: "POST",
                        body: JSON.stringify({ old_password, new_password })
                    });
                    const data = await json(res);
                    if (!res.ok) throw new Error(errText(data, "Password change failed."));

                    toast("Password changed successfully!", "success");
                    setTimeout(() => { location.href = "home.html"; }, 800);
                } catch (err) {
                    alertBox.textContent = err.message;
                    alertBox.classList.add("show");
                }
            };
        });
    </script>
</body>

</html>
