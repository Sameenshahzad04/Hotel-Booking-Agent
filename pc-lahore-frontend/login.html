<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Account Access — Pearl Continental</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Outfit:wght@400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@24.5.0/build/css/intlTelInput.css">
    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@24.5.0/build/js/intlTelInput.min.js"></script>
    <style>
        .iti {
            width: 100%;
        }

        .iti__selected-dial-code {
            color: #f8fafc;
        }

        .iti__arrow {
            border-top-color: #cbd5e1;
        }

        .iti__arrow--up {
            border-bottom-color: #cbd5e1;
        }

        /* Dark theme for the country dropdown & search box */
        .iti__dropdown-content {
            background-color: #1e293b !important;
            border: 1px solid #334155 !important;
            color: #f8fafc !important;
        }

        .iti__search-input {
            background-color: #0f172a !important;
            color: #f8fafc !important;
            border-bottom: 1px solid #334155 !important;
        }

        .iti__country-list {
            background-color: #1e293b !important;
        }

        .iti__country {
            color: #f8fafc !important;
        }

        .iti__country .iti__country-name {
            color: #f8fafc !important;
        }

        .iti__country .iti__dial-code {
            color: #94a3b8 !important;
        }

        .iti__country.iti__highlight,
        .iti__country:hover {
            background-color: #334155 !important;
        }
    </style>

</head>

<body>
    <main id="main" class="section"
        style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 136px);">
        <div class="wrap" style="max-width:480px;width:100%;">
            <div class="card">
                <!-- Mode Switcher Tabs -->
                <div class="row" style="background:var(--s2); padding:.25rem; border-radius:8px; margin-bottom:1.5rem;">
                    <button type="button" id="tab-login" class="btn sm primary" style="flex:1; border-radius:6px;">Log
                        In</button>
                    <button type="button" id="tab-register" class="btn sm"
                        style="flex:1; background:transparent; color:#94a3b8; border:none; border-radius:6px;">Register</button>
                </div>

                <!-- Dynamic Title & Subtitle -->
                <h1 id="form-title"> Welcome </h1>
                <p class="muted" id="form-subtitle">Sign in to manage your reservations and payment holds.</p>

                <div class="alert" id="alert" role="alert"></div>

                <!-- LOGIN FORM -->
                <form id="login-form" novalidate>
                    <div class="field">
                        <label for="login-email">Email</label>
                        <input id="login-email" type="email" autocomplete="email" required>
                        <p class="err" id="login-email-err"></p>
                    </div>
                    <div class="field">
                        <label for="login-password">Password</label>
                        <div class="pw">
                            <input id="login-password" type="password" autocomplete="current-password" required
                                minlength="8">
                            <button type="button" id="toggle-login-pw" aria-label="Show password">Show</button>
                        </div>
                        <p class="err" id="login-password-err"></p>
                    </div>
                    <button class="btn primary lg block" type="submit" style="margin-top:1rem">Log in →</button>
                </form>

                <!-- REGISTER FORM -->
                <form id="register-form" novalidate style="display:none;">
                    <div class="field">
                        <label for="reg-name">Full name</label>
                        <input id="reg-name" autocomplete="name" required>
                        <p class="err" id="reg-name-err"></p>
                    </div>

                    <div class="field">
                        <label for="reg-email">Email</label>
                        <input id="reg-email" type="email" autocomplete="email" required>
                        <p class="err" id="reg-email-err"></p>
                    </div>

                    <div class="field">
                        <label for="reg-phone">Mobile Number</label>
                        <input id="reg-phone" type="tel" autocomplete="tel"
                            oninput="this.value = this.value.replace(/\D/g, '').slice(0, 10)">
                        <p class="err" id="reg-phone-err"></p>
                    </div>

                    <div class="row" style="gap:1rem;">
                        <div class="field" style="flex:1">
                            <label for="reg-age">Age (Optional)</label>
                            <input id="reg-age" type="number" min="12" max="150" placeholder="e.g. 25">
                            <p class="err" id="reg-age-err"></p>
                        </div>
                        <div class="field" style="flex:1">
                            <label for="reg-gender">Gender (Optional)</label>
                            <select id="reg-gender"
                                style="height:42px; background:var(--s2); color:#fff; border:1px solid #334155; border-radius:6px; width:100%; padding:0 .5rem;">
                                <option value="">Select gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>
                            <p class="err" id="reg-gender-err"></p>
                        </div>
                    </div>

                    <div class="field">
                        <label for="reg-address">Address (Optional)</label>
                        <input id="reg-address" type="text" placeholder="Street address, city">
                        <p class="err" id="reg-address-err"></p>
                    </div>

                    <div class="field">
                        <label for="reg-password">Password</label>
                        <div class="pw">
                            <input id="reg-password" type="password" autocomplete="new-password" required minlength="8"
                                maxlength="15">
                            <button type="button" id="toggle-reg-pw" aria-label="Show password">Show</button>
                        </div>
                        <p class="muted" style="font-size:0.8rem; margin-top:.25rem;">Use between 8 to 15 characters.
                        </p>
                        <p class="err" id="reg-password-err"></p>
                    </div>

                    <div class="field">
                        <label for="reg-confirm-password">Confirm password</label>
                        <div class="pw">
                            <input id="reg-confirm-password" type="password" autocomplete="new-password" required
                                minlength="8" maxlength="15">
                            <button type="button" id="toggle-reg-confirm-pw"
                                aria-label="Show confirm password">Show</button>
                        </div>
                        <p class="err" id="reg-confirm-password-err"></p>
                    </div>

                    <button class="btn primary lg block" type="submit" style="margin-top:1rem">Create account →</button>
                </form>
            </div>
        </div>
    </main>

    <script src="common.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(location.search);
            if (urlParams.has("logout")) {
                try {
                    if (getToken()) {
                        await apiFetch("/auth/logout", { method: "POST" });
                    }
                } catch (err) {
                    console.error("Backend logout error:", err);
                } finally {
                    clearSession();
                    toast("Logged out successfully.", "success");
                    window.history.replaceState({}, document.title, "login.html");
                }
            }

            renderHeader("login");

            if (getToken() && !urlParams.has("logout")) {
                location.href = "home.html";
                return;
            }

            // ---------- Phone field: flag + dial code + searchable country list ----------
            const phoneInput = $("reg-phone");
            const iti = window.intlTelInput(phoneInput, {
                initialCountry: "pk",
                separateDialCode: true,
                utilsScript: "https://cdn.jsdelivr.net/npm/intl-tel-input@24.5.0/build/js/utils.js"
            });

            // ---------- Tab switching ----------
            const tabLogin = $("tab-login");
            const tabRegister = $("tab-register");
            const loginForm = $("login-form");
            const registerForm = $("register-form");
            const formTitle = $("form-title");
            const formSubtitle = $("form-subtitle");
            const alertEl = $("alert");

            function switchTab(mode) {
                alertEl.classList.remove("show");
                $$(".err").forEach(el => el.textContent = "");

                if (mode === "login") {
                    tabLogin.className = "btn sm primary";
                    tabRegister.className = "btn sm";
                    tabRegister.style.background = "transparent";
                    tabRegister.style.color = "#94a3b8";

                    loginForm.style.display = "block";
                    registerForm.style.display = "none";
                    formTitle.textContent = "Welcome back";
                    formSubtitle.textContent = "Sign in to manage your reservations and payment holds.";
                    history.replaceState(null, "", "login.html");
                } else {
                    tabRegister.className = "btn sm primary";
                    tabLogin.className = "btn sm";
                    tabLogin.style.background = "transparent";
                    tabLogin.style.color = "#94a3b8";

                    registerForm.style.display = "block";
                    loginForm.style.display = "none";
                    formTitle.textContent = "Create your account";
                    formSubtitle.textContent = "Book faster and keep all reservations in one place.";
                    history.replaceState(null, "", "login.html?mode=register");
                }
            }

            tabLogin.onclick = () => switchTab("login");
            tabRegister.onclick = () => switchTab("register");

            // Auto-switch if URL has ?mode=register
            if (urlParams.get("mode") === "register") {
                switchTab("register");
            }

            // ---------- Password toggles ----------
            $("toggle-login-pw").onclick = () => {
                const p = $("login-password"), s = p.type === "password";
                p.type = s ? "text" : "password";
                $("toggle-login-pw").textContent = s ? "Hide" : "Show";
            };

            $("toggle-reg-pw").onclick = () => {
                const p = $("reg-password"), s = p.type === "password";
                p.type = s ? "text" : "password";
                $("toggle-reg-pw").textContent = s ? "Hide" : "Show";
            };

            $("toggle-reg-confirm-pw").onclick = () => {
                const p = $("reg-confirm-password"), s = p.type === "password";
                p.type = s ? "text" : "password";
                $("toggle-reg-confirm-pw").textContent = s ? "Hide" : "Show";
            };

            // ---------- Login submit ----------
            loginForm.onsubmit = async e => {
                e.preventDefault();
                alertEl.classList.remove("show");
                $("login-email-err").textContent = "";
                $("login-password-err").textContent = "";

                const email = $("login-email").value.trim();
                const password = $("login-password").value;
                let ok = true;

                if (!email) { $("login-email-err").textContent = "Email is required."; ok = false; }
                if (!password) { $("login-password-err").textContent = "Password is required."; ok = false; }
                if (!ok) return;

                const btn = loginForm.querySelector("button[type=submit]");
                btn.disabled = true;
                btn.textContent = "Signing in…";

                try {
                    const r = await apiFetch("/auth/login", {
                        method: "POST",
                        body: JSON.stringify({ email, password })
                    });
                    const d = await json(r);

                    if (!r.ok) throw new Error(errText(d, "Invalid email or password."));

                    setSession(d.session_token, d.user);
                    toast("Logged in successfully!", "success");

                    const q = new URLSearchParams(location.search);
                    setTimeout(() => {
                        location.href = safeNext(q.get("next"));
                    }, 500);

                } catch (err) {
                    alertEl.textContent = err.message;
                    alertEl.classList.add("show");
                } finally {
                    btn.disabled = false;
                    btn.textContent = "Log in →";
                }
            };

            // ---------- Register submit ----------
            registerForm.onsubmit = async e => {
                e.preventDefault();
                alertEl.classList.remove("show");
                $$(".err").forEach(x => x.textContent = "");

                const name = $("reg-name").value.trim();
                const email = $("reg-email").value.trim();
                const rawPhone = phoneInput.value.trim();
                const ageVal = $("reg-age").value.trim();
                const gender = $("reg-gender").value;
                const address = $("reg-address").value.trim();
                const p = $("reg-password").value;
                const c = $("reg-confirm-password").value;

                let ok = true;
                if (name.length < 2) { $("reg-name-err").textContent = "Enter your full name."; ok = false; }
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { $("reg-email-err").textContent = "Enter a valid email address."; ok = false; }

                // Phone is optional. If given, it must be valid for the selected country.
                let fullPhone = null;
                if (rawPhone) {
                    try { await iti.promise; } catch (_) { /* validation script failed to load */ }
                    const valid = iti.isValidNumber();          // true / false / null (null = script not loaded)
                    if (valid === false || (valid === null && rawPhone.replace(/\D/g, "").length < 7)) {
                        $("reg-phone-err").textContent = "Please enter a valid mobile number for the selected country.";
                        ok = false;
                    } else {
                        fullPhone = valid ? iti.getNumber() : "+" + iti.getSelectedCountryData().dialCode + rawPhone.replace(/\D/g, "");
                    }
                }

                if (p.length < 8 || p.length > 15) { $("reg-password-err").textContent = "Password must be between 8 and 15 characters."; ok = false; }
                if (p !== c) { $("reg-confirm-password-err").textContent = "Passwords do not match."; ok = false; }

                if (!ok) return;

                const btn = registerForm.querySelector("button[type=submit]");
                btn.disabled = true;
                btn.textContent = "Creating account…";

                try {
                    const payload = {
                        full_name: name,
                        email: email,
                        password: p,
                        phone: fullPhone,                       // e.g. +923001234567
                        age: ageVal ? Number(ageVal) : null,
                        gender: gender || null,
                        address: address || null
                    };

                    const r = await apiFetch("/auth/register", {
                        method: "POST",
                        body: JSON.stringify(payload)
                    });
                    const d = await json(r);
                    if (!r.ok) throw new Error(errText(d, "Registration failed."));

                    // Auto-login after successful registration
                    const loginRes = await apiFetch("/auth/login", {
                        method: "POST",
                        body: JSON.stringify({ email, password: p })
                    });
                    const loginData = await json(loginRes);
                    if (loginRes.ok) {
                        setSession(loginData.session_token, loginData.user);
                    }

                    toast("Account created. Welcome to Pearl Continental!", "success");
                    setTimeout(() => {
                        location.href = safeNext(new URLSearchParams(location.search).get("next"));
                    }, 500);

                } catch (err) {
                    alertEl.textContent = err.message;
                    alertEl.classList.add("show");
                } finally {
                    btn.disabled = false;
                    btn.textContent = "Create account →";
                }
            };
        });
    </script>


</body>
