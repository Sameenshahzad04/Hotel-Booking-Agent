    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            renderHeader("bookings");
            if (!getToken()) { goLogin(); return; }

            const q = new URLSearchParams(location.search);
            if (q.get("confirmed") === "1") {
                toast("Payment confirmed successfully!", "success");
            } else if (q.get("refund") === "success") {
                toast("Booking successfully cancelled and refunded.", "success");
            }

            await loadBookings();
        });

        async function loadBookings() {
            try {
                const r = await apiFetch("/bookings");
                const d = await json(r);
                if (!r.ok) throw new Error(errText(d));

                const items = Array.isArray(d) ? d : (d.bookings || d.items || []);
                const listEl = $("list");

                if (!items.length) {
                    listEl.innerHTML = `<div class="card center"><h2>No bookings found</h2><p class="muted" style="margin:.5rem 0 1rem">You have no booking history.</p><a class="btn primary" href="book.html">Book a stay</a></div>`;
                    return;
                }

                listEl.innerHTML = items.map(b => {
                    const st = b.status || {};
                    const label = st.display_status || "Confirmed";
                    const badge = st.badge_class || "b-ok";
                    const canPay = st.can_pay === true;
                    const canRefund = st.can_refund === true;
                    const ref = b.booking_ref;
                    const nights = b.nights || 1;
                    const adults = b.guests || 1;
                    const children = b.children || 0;

                    // Safely parse room breakdown items
                    const roomsHtml = Array.isArray(b.rooms) ? b.rooms.map(r => `
                        <div style="display:flex; justify-content:space-between; font-size:0.9rem; margin-top:.2rem;">
                            <span>${esc(r.name || r.room_type || r)} (${fmtPKR(r.price_per_night || 0)} × ${nights} night${nights > 1 ? 's' : ''})</span>
                            <span style="font-weight:500;">${fmtPKR((r.price_per_night || 0) * nights)}</span>
                        </div>
                    `).join("") : `<div style="font-size:0.9rem;">${esc(b.rooms)}</div>`;

                    // // Safely parse add-on services breakdown items
                    // const servicesHtml = Array.isArray(b.services) && b.services.length ? b.services.map(s => `
                    //     <div style="display:flex; justify-content:space-between; font-size:0.9rem; margin-top:.2rem;">
                    //         <span>${esc(s.name)} (Qty: ${s.quantity} × ${fmtPKR(s.unit_price)} / ${s.pricing_unit})</span>
                    //         <span style="font-weight:500;">${fmtPKR(s.line_total || (s.quantity * s.unit_price))}</span>
                    //     </div>
                    // `).join("") : '<div style="color:var(--muted); font-size:0.9rem;">None</div>';


                    // Safely map add-on services breakdown items with full calculation details
                    const servicesHtml = Array.isArray(b.services) && b.services.length ? b.services.map(s => `
                              <div style="display:flex; justify-content:space-between; font-size:0.9rem; margin-top:.2rem;">
                             <span>${esc(s.name)} (Qty: ${s.quantity} × ${fmtPKR(s.unit_price)} / ${s.pricing_unit})</span>
                             <span style="font-weight:500;">${fmtPKR(s.line_total || (s.quantity * s.unit_price))}</span>
                         </div>
                        `).join("") : '<div style="color:var(--muted); font-size:0.9rem;">None</div>';

                    return `
    <article class="card booking-card" style="display:flex; flex-direction:column; gap:1rem; cursor:pointer;" onclick="toggleBookingDetails('${esc(ref)}')">
      <div class="row between" style="align-items:flex-start;">
        <div>
          <span class="muted" style="font-size:.85rem; text-transform:uppercase;">Ref: #${esc(ref)}</span>
          <h3 style="margin-top:.2rem;">${esc(Array.isArray(b.rooms) ? b.rooms.map(r => r.name || r.room_type).join(", ") : (b.rooms?.[0] || "Luxury Stay"))}</h3>
          <p class="muted">${fmtDate(b.check_in)} → ${fmtDate(b.check_out)} · ${nights} night${nights === 1 ? "" : "s"} · ${adults} adult${adults === 1 ? "" : "s"} ${children ? `· ${children} child(ren)` : ""}</p>
        </div>
        <span class="badge ${badge}">${esc(label)}</span>
      </div>

      <!-- Expanded Detailed Bill Breakdown Drawer -->
      <div id="details-${esc(ref)}" style="display:none; border-top:1px dashed var(--line); padding-top:1rem; margin-top:.5rem;">
        <div style="background:var(--s2); padding:1rem; border-radius:6px;">
            <strong style="font-size:0.95rem; display:block; margin-bottom:.5rem;">Reservation &amp; Bill Breakdown</strong>
            
            <div style="margin-bottom:.5rem;">
                <span style="font-size:0.8rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px;">Rooms</span>
                ${roomsHtml}
            </div>

            <div style="margin-top:.75rem; margin-bottom:.5rem;">
                <span style="font-size:0.8rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px;">Add-on Services</span>
                ${servicesHtml}
            </div>

            <div style="margin-top:.75rem; border-top:1px solid #334155; padding-top:.5rem; display:flex; justify-content:space-between; font-size:0.9rem;">
                <strong>Total Occupants:</strong>
                <span>${adults} Adult${adults === 1 ? '' : 's'}, ${children} Child${children === 1 ? '' : 'ren'}</span>
            </div>
        </div>
      </div>

      <div class="row between" style="border-top:1px solid var(--line); padding-top:1rem; align-items:center;" onclick="event.stopPropagation()">
        <span class="price">${fmtPKR(b.total_amount)}</span>
        <div class="row" style="gap:.75rem;">
          ${canPay ? `<a class="btn sm" href="service.html?ref=${encodeURIComponent(ref)}">Manage Services</a>` : ""}
          ${canPay ? `<a class="btn sm primary" href="payment.html?ref=${encodeURIComponent(ref)}">Pay Now →</a>` : ""}
          ${canRefund ? `<a class="btn sm" href="refund.html?ref=${encodeURIComponent(ref)}">Check Refund / Cancel</a>` : ""}
          ${canPay ? `<button class="btn sm danger" onclick="cancelHold('${esc(ref)}')">Cancel Hold</button>` : ""}
        </div>
      </div>
    </article>`;
                }).join("");

            } catch (err) {
                $("list").innerHTML = `<div class="alert show">${esc(err.message)}</div>`;
            }
        }

        function toggleBookingDetails(ref) {
            const el = document.getElementById(`details-${ref}`);
            if (el) {
                el.style.display = el.style.display === "none" ? "block" : "none";
            }
        }

        async function cancelHold(ref) {
            if (!await confirmDialog(`Cancel booking hold #${ref}?`, "Cancel Hold", true)) return;
            try {
                const r = await apiFetch(`/bookings/${encodeURIComponent(ref)}/cancel`, { method: "POST" });
                const d = await json(r);
                if (!r.ok) throw new Error(errText(d));
                toast("Hold cancelled successfully.", "success");
                loadBookings();
            } catch (err) {
                toast(err.message, "error");
            }
        }
    </script>
