<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booking Details | Pearl Continental Lahore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="bookings">
<main>
  <div class="page-banner"><div class="container">
    <div class="breadcrumb"><a href="index.html">Home</a> › <a href="bookings.html">My Bookings</a> › Details</div>
    <h1 id="banner-title">Booking details</h1>
  </div></div>
  <div class="container" style="padding-top:1.75rem">
    <div id="content"><div class="skeleton" style="height:300px"></div></div>
  </div>
</main>

<script src="app.js"></script>
<script src="chat.js"></script>
<script>
(async () => {
  const { $, $$, api, esc, money, fmtDate, qs, toast, dialog, withLoading, pay, uid, unitLabel } = App;
  App.setTitle('Booking Details');
  if (!(await App.requireAuth())) return;

  const ref = qs('ref');
  if (!ref) { location.replace('bookings.html'); return; }
  let b = null, allServices = [], timer = null, idem = uid('tx');

  async function load() {
    try { b = await api(`/bookings/${encodeURIComponent(ref)}`); }
    catch (e) { $('#content').innerHTML = `<div class="card empty"><div class="big">🔍</div><h3>Booking not available</h3><p class="muted" style="margin:.4rem 0 1rem">${esc(e.message)}</p><a class="btn btn-primary" href="bookings.html">Back to my bookings</a></div>`; return; }
    if (b.status.can_pay && !allServices.length) { try { allServices = (await api('/services', { auth: false })).services; } catch { /* optional */ } }
    render();
  }

  function render() {
    const s = b.status;
    $('#banner-title').textContent = `Booking ${b.booking_ref}`;
    const roomLines = b.rooms.map((r) => `<tr><td>${esc(r.room_type)}${r.room_number ? ` <span class="chip">Room ${esc(r.room_number)}</span>` : ''}</td><td style="text-align:right">${money(r.price_per_night)} / night</td></tr>`).join('');
    const svcLines = b.services.map((x) => `<tr><td>${esc(x.name)} × ${x.quantity}</td><td style="text-align:right">${money(x.unit_price * x.quantity)}</td></tr>`).join('');

    $('#content').innerHTML = `<div class="layout-2">
      <div class="stack">
        <section class="card">
          <div class="row between"><h2 class="card-title" style="margin:0">Stay details</h2><span class="badge ${esc(s.badge_class)}">${esc(s.display_status)}</span></div>
          <hr class="divider">
          <dl class="kv">
            <dt>Reference</dt><dd>${esc(b.booking_ref)}</dd>
            ${b.confirmation_code ? `<dt>Confirmation code</dt><dd><span class="chip" style="font-size:.9rem">${esc(b.confirmation_code)}</span></dd>` : ''}
            <dt>Guest</dt><dd>${esc(b.guest_name)} · ${esc(b.guest_email)}</dd>
            <dt>Check-in</dt><dd>${fmtDate(b.check_in)} (from 14:00)</dd>
            <dt>Check-out</dt><dd>${fmtDate(b.check_out)} (until 12:00)</dd>
            <dt>Nights · Guests</dt><dd>${b.nights} · ${b.guests}</dd>
          </dl>
        </section>

        <section class="card">
          <h2 class="card-title">Rooms &amp; services</h2>
          <table style="width:100%;border-collapse:collapse;font-size:.93rem">
            ${roomLines}${svcLines}
            <tr><td colspan="2"><hr class="divider"></td></tr>
            <tr><td><strong>Total</strong></td><td style="text-align:right"><strong style="font-size:1.15rem">${money(b.total_amount)}</strong></td></tr>
          </table>
          ${!b.services.length ? '<p class="muted small" style="margin-top:.6rem">No add-on services on this booking.</p>' : ''}
        </section>

        ${s.can_pay ? `<section class="card" id="addons">
          <h2 class="card-title">Add services</h2>
          <p class="muted small" style="margin-bottom:1rem">You can add or change services until you pay.</p>
          ${allServices.map((sv) => {
            const cur = b.services.find((x) => x.name === sv.name);
            return `<div class="pick-card ${cur ? 'selected' : ''}"><div><strong>${esc(sv.name)}</strong><div class="muted small">${esc(sv.description || '')}</div><div style="margin-top:.2rem"><strong>${money(sv.price)}</strong> <span class="muted small">${esc(unitLabel(sv.pricing_unit))}</span></div></div>
              <div class="qty" data-id="${sv.id}" data-q="${cur ? cur.quantity : 0}"><button type="button" data-d="-1" aria-label="Decrease">−</button><span>${cur ? cur.quantity : 0}</span><button type="button" data-d="1" aria-label="Increase">+</button></div></div>`;
          }).join('')}
        </section>` : ''}
      </div>

      <aside class="summary stack">
        ${s.can_pay ? `<div class="card"><div class="muted small">Hold expires in</div><div class="countdown" id="cd">${esc(s.countdown)}</div>
          <button class="btn btn-gold btn-lg btn-block" id="pay" style="margin-top:1rem">Pay ${money(b.total_amount)}</button>
          <button class="btn btn-danger-outline btn-block" id="cancel" style="margin-top:.6rem">Release hold</button>
          <p class="muted small" style="margin-top:.8rem">Demonstration payment — no real charge is made.</p></div>` : ''}
        ${s.can_refund ? `<div class="card"><h3 class="card-title" style="font-size:1.05rem">Need to cancel?</h3><p class="muted small" style="margin-bottom:1rem">See your refund amount first. Nothing is cancelled until you confirm.</p>
          <button class="btn btn-danger-outline btn-block" id="refund">Cancel &amp; request refund</button></div>` : ''}
        ${!s.can_pay && !s.can_refund ? `<div class="card"><p class="muted small">No actions are available for a booking that is ${esc(s.display_status.toLowerCase())}.</p><a class="btn btn-primary btn-block" style="margin-top:.8rem" href="book.html">Book another stay</a></div>` : ''}
        <div class="card"><h3 class="card-title" style="font-size:1.05rem">Questions?</h3><p class="muted small">Ask our concierge using the chat button — it can see only your own bookings.</p></div>
      </aside></div>`;
    wire();
  }

  function wire() {
    const s = b.status;
    if (s.can_pay) {
      startCountdown(s.seconds_left);
      $('#pay').onclick = async () => {
        try {
          const r = await withLoading($('#pay'), () => pay(ref, idem));
          toast('Payment successful. Confirmation sent by email.', 'success');
          stopCountdown(); await load();
        } catch (e) { toast(e.message, 'error'); }
      };
      $('#cancel').onclick = async () => {
        const ok = await dialog({ title: 'Release this hold?', message: 'Your room will be made available to other guests.', confirmText: 'Release hold', danger: true });
        if (!ok) return;
        try { await api(`/bookings/${encodeURIComponent(ref)}/cancel`, { method: 'POST' }); toast('Hold released.', 'success'); stopCountdown(); await load(); }
        catch (e) { toast(e.message, 'error'); }
      };
      $$('#addons .qty').forEach((el) => $$('button', el).forEach((btn) => btn.onclick = async () => {
        const next = Math.max(0, Math.min(10, Number(el.dataset.q) + Number(btn.dataset.d)));
        if (next === Number(el.dataset.q)) return;
        if (next === 0) { toast('To remove a service, please contact the concierge.', 'info'); return; }
        try {
          const r = await api(`/services/bookings/${encodeURIComponent(ref)}/services`, { method: 'POST', body: { service_id: Number(el.dataset.id), quantity: next } });
          toast('Services updated.', 'success'); await load();
        } catch (e) { toast(e.message, 'error'); }
      }));
    }
    if (s.can_refund) {
      $('#refund').onclick = async () => {
        let quote;
        try { quote = await api(`/bookings/${encodeURIComponent(ref)}/refund-quote`); }
        catch (e) { toast(e.message, 'error'); return; }
        if (!quote.eligible) { await dialog({ title: 'Not eligible for a refund', message: esc(quote.reason), confirmText: 'OK', cancelText: 'Close' }); return; }
        const code = await dialog({
          title: 'Cancel and refund', danger: true, confirmText: 'Cancel booking',
          message: `<p>${esc(quote.reason)}</p><p style="margin-top:.6rem">Refund: <strong>${money(quote.refund_amount)}</strong> (${quote.percent}% of ${money(quote.total_amount)})</p>`,
          input: { label: 'Confirmation code', placeholder: 'HB-XXXXXX', hint: 'Enter the code from your confirmation email to proceed.' }
        });
        if (!code) return;
        try {
          const r = await api(`/bookings/${encodeURIComponent(ref)}/refund-and-cancel?confirmation_code=${encodeURIComponent(code.toUpperCase())}`, { method: 'POST', headers: { 'X-Idempotency-Key': uid('ref') } });
          toast(`Booking cancelled. Refund of ${money(r.refund_amount)} issued.`, 'success'); await load();
        } catch (e) { toast(e.message, 'error'); }
      };
    }
  }

  function startCountdown(sec) {
    stopCountdown(); let left = sec;
    timer = setInterval(() => {
      left--;
      if (left <= 0) { stopCountdown(); toast('This hold has expired.', 'error'); load(); return; }
      const el = $('#cd'); if (el) el.textContent = [Math.floor(left / 3600), Math.floor(left % 3600 / 60), left % 60].map((n) => String(n).padStart(2, '0')).join(':');
    }, 1000);
  }
  function stopCountdown() { clearInterval(timer); timer = null; }

  load();
})();
</script>
</body>
</html>
