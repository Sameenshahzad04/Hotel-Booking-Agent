<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rooms & Suites | Pearl Continental Lahore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="rooms">
<main>
  <div class="page-banner"><div class="container">
    <div class="breadcrumb"><a href="index.html">Home</a> › Rooms &amp; Suites</div>
    <h1>Rooms &amp; Suites</h1>
    <p>Choose your dates to see live availability and prices.</p>
  </div></div>

  <div class="search-bar"><div class="container">
    <form class="search-card" id="search">
      <div class="field"><label for="ci">Check-in</label><input class="input" type="date" id="ci" required></div>
      <div class="field"><label for="co">Check-out</label><input class="input" type="date" id="co" required></div>
      <div class="field"><label for="gu">Guests</label><input class="input" type="number" id="gu" min="1" max="20" value="2" required></div>
      <button class="btn btn-primary btn-lg" type="submit">Search</button>
    </form>
  </div></div>

  <div class="container" style="padding-top:2rem">
    <div id="summary" class="muted" style="margin-bottom:1rem"></div>
    <div id="results"></div>
  </div>
</main>

<script src="app.js"></script>
<script src="chat.js"></script>
<script>
(() => {
  const { $, api, esc, money, todayISO, addDays, diffDays, fmtDate, qs, toast } = App;
  const ci = $('#ci'), co = $('#co'), gu = $('#gu');

  ci.min = todayISO();
  ci.value = qs('check_in') || todayISO();
  co.value = qs('check_out') || addDays(ci.value, 1);
  co.min = addDays(ci.value, 1);
  gu.value = qs('guests') || 2;

  ci.addEventListener('change', () => {
    co.min = addDays(ci.value, 1);
    if (!co.value || diffDays(ci.value, co.value) < 1) co.value = addDays(ci.value, 1);
  });

  async function search() {
    if (diffDays(ci.value, co.value) < 1) { toast('Check-out must be after check-in.', 'error'); return; }
    const nights = diffDays(ci.value, co.value);
    $('#results').innerHTML = '<div class="skeleton" style="height:190px;margin-bottom:1rem"></div><div class="skeleton" style="height:190px"></div>';
    $('#summary').textContent = '';
    history.replaceState(null, '', `?check_in=${ci.value}&check_out=${co.value}&guests=${gu.value}`);
    try {
      const d = await api(`/rooms/availability?check_in=${ci.value}&check_out=${co.value}&guests=${gu.value}`, { auth: false });
      $('#summary').innerHTML = `<strong>${fmtDate(ci.value)}</strong> → <strong>${fmtDate(co.value)}</strong> · ${nights} night${nights > 1 ? 's' : ''} · ${gu.value} guest${gu.value > 1 ? 's' : ''}`;
      if (!d.availability.length) { $('#results').innerHTML = '<div class="card empty"><div class="big">🛏️</div><h3>No rooms found</h3><p class="muted">Please try different dates.</p></div>'; return; }
      $('#results').innerHTML = d.availability.map((r) => {
        const none = r.available_rooms < 1;
        const low = r.available_rooms > 0 && r.available_rooms <= 2;
        const params = `check_in=${ci.value}&check_out=${co.value}&guests=${gu.value}&room=${r.room_type_id}`;
        return `<article class="card room-card">
          <div class="room-media">${esc(r.name[0])}<small>${esc(r.bed_type)}</small></div>
          <div class="room-body">
            <h3>${esc(r.name)}</h3>
            <div class="room-meta"><span>👥 Sleeps ${r.max_guests}</span><span>🛏️ ${esc(r.bed_type)}</span></div>
            <p class="muted small">${esc(r.description || '')}</p>
            <div style="margin-top:.8rem">${(r.amenities || []).map((a) => `<span class="chip" style="margin:0 .3rem .3rem 0">${esc(a)}</span>`).join('')}</div>
          </div>
          <div class="room-side">
            <div class="availability ${none ? 'none' : low ? 'low' : 'ok'}">${none ? 'Sold out for these dates' : low ? `Only ${r.available_rooms} left` : `${r.available_rooms} available`}</div>
            <div><div class="price">${money(r.base_price)}<small>per night · ${money(r.base_price * nights)} total</small></div>
            <a class="btn btn-primary ${none ? 'hidden' : ''}" style="margin-top:.7rem" href="book.html?${params}">Select room</a></div>
          </div>
        </article>`;
      }).join('');
    } catch (e) {
      $('#results').innerHTML = `<div class="alert alert-error">${esc(e.message)}</div>`;
    }
  }
  $('#search').addEventListener('submit', (e) => { e.preventDefault(); search(); });
  App.setTitle('Rooms & Suites');
  search();
})();
</script>
</body>
</html>
